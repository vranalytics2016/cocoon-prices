name: Auto Fetch Live Cocoon Rates

on:
  schedule:
    # Runs every 45 mins between 12:00 PM IST and 6:30 PM IST (06:15 to 13:00 UTC), Mon-Sat
    - cron: '15,45 6-13 * * 1-6'
  workflow_dispatch: # Allows manual run anytime from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Smart Scraper
        run: python scraper.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add cocoon_rates.csv summary.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated cocoon rates & summary [$(date +'%Y-%m-%d %H:%M')]" && git push)
